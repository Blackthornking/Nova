name: LUMA-X Rust Tests and Proof Benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-x-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Build and test recursive proof system
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate the LUMA-X Rust project
        shell: bash
        run: |
          set -euo pipefail
          find_manifest() {
            grep -rl --include=Cargo.toml 'luma-x-proof-backend' . 2>/dev/null | head -n 1 || true
          }
          manifest=$(find_manifest)
          if [ -z "$manifest" ]; then
            zip=$(find . -path ./.git -prune -o -type f -name '*.zip' -print | head -n 1)
            if [ -n "$zip" ]; then
              echo "Extracting $zip"
              mkdir -p _luma_src
              unzip -q -o "$zip" -d _luma_src
              manifest=$(find_manifest)
            fi
          fi
          if [ -z "$manifest" ]; then
            echo "::error::No Cargo.toml with package luma-x-proof-backend found (checked repo and any zip)."
            echo "Files at repo root:"
            ls -la
            exit 1
          fi
          dir=$(dirname "$manifest")
          echo "Found project in: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PROJECT_DIR }}

      - name: Check formatting (advisory)
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo fmt --all -- --check

      - name: Compile tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --release --no-run

      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          RUST_BACKTRACE: "1"
          RUST_TEST_THREADS: "1"
        run: cargo test --release -- --nocapture

      - name: Clippy (advisory)
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo clippy --release --all-targets -- -D warnings

  compressed-proof-benchmark:
    name: Compressed proof verification benchmark
    runs-on: ubuntu-latest
    needs: rust-tests
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate the LUMA-X Rust project
        shell: bash
        run: |
          set -euo pipefail
          find_manifest() {
            grep -rl --include=Cargo.toml 'luma-x-proof-backend' . 2>/dev/null | head -n 1 || true
          }
          manifest=$(find_manifest)
          if [ -z "$manifest" ]; then
            zip=$(find . -path ./.git -prune -o -type f -name '*.zip' -print | head -n 1)
            if [ -n "$zip" ]; then
              echo "Extracting $zip"
              mkdir -p _luma_src
              unzip -q -o "$zip" -d _luma_src
              manifest=$(find_manifest)
            fi
          fi
          if [ -z "$manifest" ]; then
            echo "::error::No Cargo.toml with package luma-x-proof-backend found (checked repo and any zip)."
            ls -la
            exit 1
          fi
          dir=$(dirname "$manifest")
          echo "Found project in: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PROJECT_DIR }}

      - name: Run end-to-end proof and verification benchmark
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          LUMA_VERIFY_ITERS: "20"
          RUST_BACKTRACE: "1"
        shell: bash
        run: |
          set -o pipefail
          cargo run --release 2>&1 | tee "$GITHUB_WORKSPACE/benchmark-run.log"

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luma-x-compressed-proof-benchmark
          path: benchmark-run.log
          if-no-files-found: warn
          retention-days: 30
