name: LUMA-X Rust Tests and Proof Benchmark

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Build and test recursive proof system
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Compile tests
        run: cargo test --release --no-run

      - name: Run tests
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --release -- --nocapture

      - name: Run Clippy
        continue-on-error: true
        run: cargo clippy --release --all-targets -- -D warnings

  compressed-proof-benchmark:
    name: Compressed proof verification benchmark
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run compressed proof benchmark
        env:
          LUMA_VERIFY_ITERS: "20"
        shell: bash
        run: |
          set -o pipefail
          cargo run --release 2>&1 | tee benchmark-run.log

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luma-x-compressed-proof-benchmark
          path: benchmark-run.log
          if-no-files-found: warn
          retention-days: 30
