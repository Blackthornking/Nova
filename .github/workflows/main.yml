
name: Nerva Rust Wallet - Build Android APK

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path to the uploaded ZIP file in the repository"
        required: true
        default: "nerva-wallet.zip"
        type: string

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip file \
            build-essential pkg-config libssl-dev \
            clang cmake ninja-build

      - name: Locate and extract ZIP
        env:
          ZIP_PATH: ${{ inputs.zip_path || 'nerva-wallet.zip' }}
        run: |
          set -euo pipefail

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ZIP not found: $ZIP_PATH"
            echo "ZIP files in repository:"
            find . -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_PATH" -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 3 -type f | head -200

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Detect Rust projects
        run: |
          set -euo pipefail

          find extracted -name Cargo.toml -print

          if ! find extracted -name Cargo.toml -print -quit \
             | grep -q .; then
            echo "No Cargo.toml found."
            echo "The ZIP may contain a C++ project, not a Rust project."
            exit 1
          fi

      - name: Run Rust tests
        run: |
          set -euo pipefail

          MANIFEST="$(find extracted -name Cargo.toml \
            -print -quit)"
          PROJECT_DIR="$(dirname "$MANIFEST")"

          cd "$PROJECT_DIR"
          cargo test --workspace --locked

      - name: Build Android Rust libraries
        run: |
          set -euo pipefail

          MANIFEST="$(find extracted -name Cargo.toml \
            -print -quit)"
          PROJECT_DIR="$(dirname "$MANIFEST")"

          cd "$PROJECT_DIR"

          cargo build --release \
            --target aarch64-linux-android

      - name: Package build outputs
        if: always()
        run: |
          mkdir -p artifacts
          find extracted -type f \
            \( -name '*.apk' -o -name '*.aab' \
            -o -name '*.so' \) \
            -exec cp --parents {} artifacts/ \; || true

          if [ -d artifacts ]; then
            cd artifacts
            zip -qr ../nerva-build-artifacts.zip .
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nerva-wallet-build
          path: |
            nerva-build-artifacts.zip
            extracted/**/target/**/*.so
            extracted/**/*.apk
          if-no-files-found: warn
          retention-days: 14
